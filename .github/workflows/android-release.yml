name: Build Signed Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# برای ضمیمه‌کردن فایل به ریلیز، GITHUB_TOKEN به مجوز نوشتن روی contents نیاز دارد
# (پیش‌فرض برخی مخزن‌ها فقط‌خواندنی است).
permissions:
  contents: write

jobs:
  build-release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore PKCS12 signing key
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > app/mrm-release.p12
          test -s app/mrm-release.p12

      - name: Verify PKCS12 signing key
        shell: bash
        run: |
          keytool -list -v \
            -storetype PKCS12 \
            -keystore app/mrm-release.p12 \
            -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}"

      - name: Build signed release
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PRELEASE_STORE_FILE=app/mrm-release.p12 \
            -PRELEASE_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}" 2>&1 | tee gradle-build.log

      # اگر بیلد شکست خورد، خطوط کلیدی Gradle را به annotation تبدیل می‌کنیم تا
      # بدون دانلود لاگ کامل هم از طریق Check Annotations API قابل خواندن باشند.
      - name: Surface Gradle failure as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            grep -E "^e: |error: |FAILURE:|What went wrong|Caused by:|Execution failed|> Task .*FAILED" gradle-build.log | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::group::Full Gradle log tail"
            tail -120 gradle-build.log
            echo "::endgroup::"
          fi

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # فایلِ نگاشتِ R8 (برای retrace کردنِ stack traceهای inline‌شده).
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ضمیمه‌ی مستقیم به ریلیز گیت‌هاب (روی تگ v*) تا فایل‌ها بدون مراجعه به
      # Artifacts در دسترس باشند.
      - name: Attach assets to GitHub release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --clobber 2>&1 | tee gh-upload.log

      - name: Surface release upload failure
        if: failure() && hashFiles('gh-upload.log') != ''
        shell: bash
        run: |
          grep -E "error|HTTP|failed|permission" gh-upload.log | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
