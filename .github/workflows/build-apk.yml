name: Build Android APK

on:
  push:
    branches:
      - main
      - liquid-glass-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # چند ثانیه طول می‌کشد و خطاهای منابع را قبل از بیلدِ کندِ Gradle می‌گیرد
      - name: Validate string resources
        run: python3 tools/check-resources.py

      # همان بررسی‌هایی که تا حالا فقط دستی اجرا می‌شدند: پرانتزِ نامتوازن،
      # importِ گم‌شده، پکیجِ اشتباه در import و فراخوانیِ تابعِ ناموجود.
      # هر چهارتا در چند ثانیه اجرا می‌شوند و خطاهایی را می‌گیرند که
      # وگرنه بعد از چند دقیقه کامپایل معلوم می‌شدند.
      - name: Validate Kotlin sources
        run: |
          python3 tools/kt-balance.py
          python3 tools/kt-imports.py
          python3 tools/kt-import-paths.py
          python3 tools/kt-callcheck.py
          # یک خانوادهٔ دکمه/FAB: بیرون از ui/components فقط PG* (موتور Mrm* ممنوع)
          python3 tools/kt-family.py
          python3 tools/kt-modifier-order.py
          # فاز ۷.۱ — پالت باید AA بماند؛ اگر کسی توکنی را روشن/تیره کند، همین‌جا رد می‌شود.
          python3 tools/check-contrast.py
          # آرگومانِ موقعیتی روی پارامترِ لامبدا: با اضافه‌شدنِ پارامتری قبل از
          # یک پارامترِ تابعی، فراخوانی‌های موقعیتیِ قدیمی جابه‌جا می‌شوند و
          # کامپایل می‌شکند (باگِ واقعیِ فاز ۶: Type mismatch + No value passed).
          python3 tools/kt-lambdaargs.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # PNGهای رندرِ Robolectric (MicroRowScreenshotTest) — برای دیدنِ چیدمانِ واقعی بدون گوشی.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/test-screens/
          if-no-files-found: ignore

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # بیلدِ ریلیز (R8 + کوچک‌سازیِ منابع) همین‌جا هم ساخته می‌شود: بیلدِ debug
      # ذاتاً کندتر است (debuggable، بدونِ R8، بدونِ پروفایلِ پایه) و برای حس‌کردنِ
      # سرعتِ واقعیِ اپ باید APK ریلیز را نصب کرد. اگر کلیدِ امضا در Secrets باشد
      # APK امضاشده آپلود می‌شود؛ وگرنه فقط پیکربندیِ R8 آزمایش می‌شود تا خطای
      # قواعد همین‌جا معلوم شود، نه موقعِ انتشار.
      - name: Restore signing key (if configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/mrm-release.p12
            test -s app/mrm-release.p12
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -PRELEASE_STORE_FILE=app/mrm-release.p12 \
            -PRELEASE_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"

      - name: Check release R8 / resource shrinking (no signing key)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew :app:minifyReleaseWithR8 :app:shrinkReleaseRes

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
