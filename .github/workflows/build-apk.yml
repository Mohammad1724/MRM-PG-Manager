name: Build Android APK

on:
  push:
    branches:
      - main
      - liquid-glass-ui
      # شاخه‌های کاریِ ایجنتِ Arena: تا کارِ هر شاخه *قبل از merge* کامپایل و تست
      # شود. قبلاً فقط main بیلد می‌شد و سه کامیتِ پشتِ‌سرهم هرگز کامپایل نشدند.
      - "arena/**"
  pull_request:
  workflow_dispatch:

# با هر push تازه، اجرای قبلیِ همان شاخه لغو می‌شود تا صفِ بیلدِ ۶ دقیقه‌ای
# پشتِ هم نیفتد (و نتیجهٔ کهنه روی شاخه نماند).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  inspect-previous-report:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous test report (temporary)
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: .ci-previous-report
          run-id: 40668945734
          github-token: ${{ github.token }}

      - name: Annotate previous test failures (temporary)
        run: |
          python3 - <<'PY'
          from html import unescape
          from pathlib import Path
          import re

          for path in sorted(Path('.ci-previous-report').rglob('*.html')):
              if path.parent.name != 'classes':
                  continue
              html = path.read_text(encoding='utf-8', errors='replace')
              for heading, raw in re.findall(r'<h3[^>]*>(.*?)</h3>.*?<pre[^>]*>(.*?)</pre>', html, re.S):
                  title = unescape(re.sub(r'<[^>]+>', '', heading))
                  if not any(word in title for word in ('creation only', 'status dropdown', 'labelled amount')):
                      continue
                  trace = unescape(re.sub(r'<[^>]+>', '', raw))[:3500]
                  def esc(text):
                      return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::warning title={esc(path.stem + " - " + title)}::{esc(trace)}')
          PY

      - name: Download previous screenshots (temporary)
        uses: actions/download-artifact@v4
        with:
          name: ui-screenshots
          path: .ci-previous-screenshots
          run-id: 40668945734
          github-token: ${{ github.token }}

      - name: Export selected screenshots (temporary)
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          wanted = {'infra_tabs_ltr.png', 'infra_tabs_rtl_large.png', 'host_editor_network_en.png', 'host_editor_status_rtl_short.png'}
          for path in sorted(Path('.ci-previous-screenshots').rglob('*.png')):
              if path.name not in wanted:
                  continue
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode('ascii')
              chunks = [encoded[i:i + 3900] for i in range(0, len(encoded), 3900)]
              digest = hashlib.sha256(data).hexdigest()
              for index, chunk in enumerate(chunks):
                  print(f'::notice title=PNG-{path.name}-{index + 1:03d}-of-{len(chunks):03d}-{digest}::{chunk}')
          PY


  diagnose-dialog-idleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run focused dialog diagnostics (temporary)
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*WindowIdlenessDiagnosticTest' --console=plain 2>&1 | tee diagnostic.log
      - name: Annotate focused failures (temporary)
        if: failure()
        run: python3 tools/ci-annotate.py diagnostic.log app/build/test-results/testDebugUnitTest

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # چند ثانیه طول می‌کشد و خطاهای منابع را قبل از بیلدِ کندِ Gradle می‌گیرد
      - name: Validate string resources
        run: python3 tools/check-resources.py

      # همان بررسی‌هایی که تا حالا فقط دستی اجرا می‌شدند: پرانتزِ نامتوازن،
      # importِ گم‌شده، پکیجِ اشتباه در import و فراخوانیِ تابعِ ناموجود.
      # هر چهارتا در چند ثانیه اجرا می‌شوند و خطاهایی را می‌گیرند که
      # وگرنه بعد از چند دقیقه کامپایل معلوم می‌شدند.
      - name: Validate Kotlin sources
        run: |
          python3 tools/kt-balance.py
          python3 tools/kt-imports.py
          python3 tools/kt-import-paths.py
          python3 tools/kt-callcheck.py
          # یک خانوادهٔ دکمه/FAB: بیرون از ui/components فقط PG* (موتور Mrm* ممنوع)
          python3 tools/kt-family.py
          python3 tools/kt-modifier-order.py
          # فاز ۷.۱ — پالت باید AA بماند؛ اگر کسی توکنی را روشن/تیره کند، همین‌جا رد می‌شود.
          python3 tools/check-contrast.py
          # آرگومانِ موقعیتی روی پارامترِ لامبدا: با اضافه‌شدنِ پارامتری قبل از
          # یک پارامترِ تابعی، فراخوانی‌های موقعیتیِ قدیمی جابه‌جا می‌شوند و
          # کامپایل می‌شکند (باگِ واقعیِ فاز ۶: Type mismatch + No value passed).
          python3 tools/kt-lambdaargs.py
          # فاز ۸.۴ — هدف‌های لمسِ ویجتِ صفحهٔ خانه: RemoteViews از بررسی‌های
          # Compose بیرون است و lint هم در این CI اجرا نمی‌شود؛ پس همین‌جا
          # اندازهٔ هر view کلیک‌شدنی از XML حساب و با ۴۸dp سنجیده می‌شود.
          python3 tools/check-widget-targets.py
          # وجودِ خودِ APIها در نسخهٔ Compose پروژه: دو بار CI به‌خاطرِ همین سرخ شد
          # (LocalMotionDurationScale و Modifier.textSelection). نمایه از خودِ
          # AARها ساخته شده و در مخزن کامیت است، پس اینجا دانلودی لازم نیست.
          python3 tools/kt-compose-api.py

      # خروجی در build.log نگه داشته می‌شود؛ گامِ بعدی از همان فایل خطاها را به
      # annotation تبدیل می‌کند (لاگِ اجرا از API در دسترس نیست).
      # `testDebugUnitTest` هم سورسِ main و هم تست را کامپایل می‌کند، پس خطای
      # کامپایل هم همین‌جا سرخ می‌شود.
      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee build.log

      # شکستِ گامِ قبل را به annotation تبدیل می‌کند: نامِ تستِ شکست‌خورده یا
      # `e: file://…:line: msg` کامپایلر، مستقیم روی خطِ همان فایل در تبِ Checks.
      # (لاگِ اجرا روی *.blob.core.windows.net است و از خیلی محیط‌ها خواندنی نیست.)
      - name: Annotate failures
        if: failure()
        run: python3 tools/ci-annotate.py build.log app/build/test-results/testDebugUnitTest

      # PNGهای رندرِ Robolectric (MicroRowScreenshotTest) — برای دیدنِ چیدمانِ واقعی بدون گوشی.
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: app/build/test-screens/
          if-no-files-found: ignore

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a build.log

      # بیلدِ ریلیز (R8 + کوچک‌سازیِ منابع) همین‌جا هم ساخته می‌شود: بیلدِ debug
      # ذاتاً کندتر است (debuggable، بدونِ R8، بدونِ پروفایلِ پایه) و برای حس‌کردنِ
      # سرعتِ واقعیِ اپ باید APK ریلیز را نصب کرد. اگر کلیدِ امضا در Secrets باشد
      # APK امضاشده آپلود می‌شود؛ وگرنه فقط پیکربندیِ R8 آزمایش می‌شود تا خطای
      # قواعد همین‌جا معلوم شود، نه موقعِ انتشار.
      - name: Restore signing key (if configured)
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/mrm-release.p12
            test -s app/mrm-release.p12
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -PRELEASE_STORE_FILE=app/mrm-release.p12 \
            -PRELEASE_STORE_PASSWORD="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"

      - name: Check release R8 / resource shrinking (no signing key)
        if: steps.signing.outputs.available != 'true'
        run: ./gradlew :app:minifyReleaseWithR8 :app:shrinkReleaseRes

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
