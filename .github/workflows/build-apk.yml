name: Build Android APK

on:
  push:
    branches:
      - main
      - liquid-glass-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # چند ثانیه طول می‌کشد و خطاهای منابع را قبل از بیلدِ کندِ Gradle می‌گیرد
      - name: Validate string resources
        run: python3 tools/check-resources.py

      # همان بررسی‌هایی که تا حالا فقط دستی اجرا می‌شدند: پرانتزِ نامتوازن،
      # importِ گم‌شده، پکیجِ اشتباه در import و فراخوانیِ تابعِ ناموجود.
      # هر چهارتا در چند ثانیه اجرا می‌شوند و خطاهایی را می‌گیرند که
      # وگرنه بعد از چند دقیقه کامپایل معلوم می‌شدند.
      - name: Validate Kotlin sources
        run: |
          python3 tools/kt-balance.py
          python3 tools/kt-imports.py
          python3 tools/kt-import-paths.py
          python3 tools/kt-callcheck.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRM-PG-Manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
